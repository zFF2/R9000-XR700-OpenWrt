name: Build Alpine Generic

on:
  workflow_dispatch:
  push:
    paths:
      - 'package/kernel/**'
      - 'target/linux/alpine/**'
    branches:
      - r9000-xr700-main

permissions:
  contents: read
  
jobs:
  build:
    name: Build linux/alpine/generic
    permissions:
      contents: read
      packages: read
    uses: openwrt/actions-shared-workflows/.github/workflows/kernel.yml@main
    with:
      targets: linux/alpine/generic
